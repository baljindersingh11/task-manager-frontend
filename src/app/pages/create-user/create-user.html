<div class="create-user-page">
  <div class="create-user-card">
    <p class="eyebrow">Manager</p>
    <h2>Create User</h2>
    <p class="subtitle">Create a regular user account with a temporary password.</p>

    <p class="message" *ngIf="message">{{ message }}</p>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <form (ngSubmit)="createUser()">
      <div class="form-group">
        <label>Name</label>
        <input
          type="text"
          placeholder="Enter name"
          [(ngModel)]="name"
          name="name"
          required
        >
        <small class="field-error" *ngIf="nameError">{{ nameError }}</small>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          placeholder="Enter email"
          [(ngModel)]="email"
          name="email"
          required
        >
        <small class="field-error" *ngIf="emailError">{{ emailError }}</small>
      </div>

      <div class="form-group">
        <label>Temporary password</label>
        <input
          type="password"
          placeholder="Enter temporary password"
          [(ngModel)]="password"
          name="password"
          required
        >
        <small class="field-error" *ngIf="passwordError">{{ passwordError }}</small>
      </div>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Creating...' : 'Create User' }}
      </button>
    </form>
  </div>
</div>
